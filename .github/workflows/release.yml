name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build release
        run: |
          xcodebuild \
            -project Luminotes.xcodeproj \
            -scheme Luminotes \
            -configuration Release \
            -derivedDataPath .build-release \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Import signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain

      - name: Sign app
        run: |
          set -euo pipefail
          APP=".build-release/Build/Products/Release/Luminotes.app"
          if security find-identity -v -p codesigning build.keychain 2>/dev/null | grep -q "valid identities found"; then
            IDENTITY=$(security find-identity -v -p codesigning build.keychain | awk 'NR==1 {print $2}')
            codesign --force --deep --sign "$IDENTITY" --keychain build.keychain "$APP"
          else
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --verbose=2 "$APP"

      - name: Package app
        id: package
        run: |
          set -euo pipefail
          APP=".build-release/Build/Products/Release/Luminotes.app"
          TAG="${GITHUB_REF_NAME}"
          ZIP="Luminotes-${TAG}.zip"
          DMG="Luminotes-${TAG}.dmg"

          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          hdiutil create -quiet -volname "Luminotes" -srcfolder "$APP" -ov -format UDZO "$DMG"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.dmg }}
          generate_release_notes: true
          draft: false
          prerelease: false
